<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control diari d'usuaris de l'autobús</title>

<style>
:root{
  --blau:#1565c0;
  --blau-fosc:#0d47a1;
  --verd:#2e7d32;
  --roig:#c62828;
  --taronja:#ef6c00;
  --turquesa:#00897b;
  --gris:#f2f2f2;
  --gris-fosc:#555
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  width:100%;
  overflow-x:hidden
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  margin:0;
  padding:0 0 40px;
  background:var(--gris);
  color:#222
}

header{
  background:var(--blau-fosc);
  color:#fff;
  padding:16px 20px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10
}

header h1{
  margin:0;
  font-size:1.05rem
}

header p{
  margin:4px 0 0;
  font-size:.75rem;
  opacity:.85
}

#diagnostic{
  background:#fff3cd;
  color:#7a5b00;
  font-size:.75rem;
  padding:8px 16px;
  text-align:center;
  border-bottom:1px solid #ffe08a;
  display:none
}

#toast{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  background:rgba(33,33,33,.92);
  color:#fff;
  font-size:.8rem;
  padding:8px 14px;
  border-radius:20px;
  z-index:50;
  display:none;
  max-width:90%;
  text-align:center
}

.container{
  max-width:520px;
  width:100%;
  margin:0 auto;
  padding:16px
}

.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  width:100%
}

label{
  display:block;
  font-size:.85rem;
  font-weight:600;
  color:var(--gris-fosc);
  margin-bottom:4px
}

input[type=date],
input[type=text],
select{
  display:block;
  width:100%;
  min-width:0;
  max-width:100%;
  padding:10px;
  font-size:16px;
  line-height:1.4;
  border:1px solid #ccc;
  border-radius:8px;
  margin-bottom:12px;
  background:#fff
}

input[type=date]{
  min-height:44px
}

.sentit-viatge{
  display:flex;
  gap:10px;
  margin-bottom:12px
}

.sentit-viatge label{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:12px 8px;
  border:2px solid #ccc;
  border-radius:10px;
  font-size:.9rem;
  margin-bottom:0;
  cursor:pointer
}

.sentit-viatge input{
  width:18px;
  height:18px;
  margin:0;
  accent-color:var(--blau)
}

.sentit-viatge label.actiu{
  border-color:var(--blau);
  background:#e8f0fc;
  color:var(--blau-fosc)
}

.btn{
  display:block;
  width:100%;
  padding:14px;
  font-size:1rem;
  font-weight:600;
  border:0;
  border-radius:10px;
  color:#fff;
  margin-bottom:10px;
  cursor:pointer;
  touch-action:manipulation
}

.btn-enviar{
  background:var(--blau)
}

.btn-compartir{
  background:var(--turquesa)
}

.btn-importar{
  background:var(--taronja)
}

.btn-reiniciar{
  background:var(--roig)
}

.btn-secundari{
  background:#78909c;
  font-size:.85rem;
  padding:10px
}

.btn:active{
  opacity:.85
}

input[type=file]{
  display:none
}

.resum-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px
}

.comptador-total{
  font-size:1.3rem;
  font-weight:700;
  color:var(--blau-fosc)
}

.llista-usuaris{
  height:380px;
  max-height:60vh;
  overflow-y:scroll;
  border:2px solid #90a4ae;
  border-radius:10px;
  background:#fff
}

.grup-poblacio{
  background:#e3ecf7;
  color:var(--blau-fosc);
  font-size:.75rem;
  font-weight:700;
  text-transform:uppercase;
  padding:6px 10px;
  position:sticky;
  top:0;
  z-index:1
}

/* Tota la fila és tocable (és un <label>), no sols la casella */
.fila-usuari{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  margin:0;
  border-bottom:1px solid #f0f0f0;
  font-size:inherit;
  font-weight:400;
  color:inherit;
  cursor:pointer
}

.fila-usuari input{
  width:24px;
  height:24px;
  flex-shrink:0;
  margin:0;
  accent-color:var(--verd)
}

.info-usuari{
  display:block;
  flex:1;
  min-width:0
}

.nom-usuari{
  display:block;
  font-size:.92rem;
  font-weight:600;
  line-height:1.2
}

.detall-usuari{
  display:block;
  font-size:.75rem;
  color:var(--gris-fosc)
}

.missatge-buit{
  padding:20px;
  text-align:center;
  color:var(--gris-fosc);
  font-size:.9rem;
  line-height:1.4
}

.fila-botons-inline{
  display:flex;
  gap:8px;
  margin-bottom:12px
}

.fila-botons-inline .btn{
  margin-bottom:0
}

.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:100;
  align-items:center;
  justify-content:center
}

.modal-overlay.actiu{
  display:flex
}

.modal{
  background:#fff;
  border-radius:14px;
  padding:20px;
  width:85%;
  max-width:360px;
  text-align:center
}

.modal p{
  font-size:.9rem;
  color:#333;
  margin-bottom:16px
}

.modal .fila-botons{
  display:flex;
  gap:10px
}

.modal .fila-botons .btn{
  margin-bottom:0
}

.modal-icona{
  font-size:2.2rem;
  margin-bottom:8px
}

.modal-ok p{
  color:var(--verd);
  font-weight:600
}

.modal-err p{
  color:var(--roig);
  font-weight:600
}
</style>
</head>

<body>

<header>
  <h1>🚌 Control diari d'usuaris de l'autobús</h1>
  <p>Marca qui puja i envia el resum del dia per correu</p>
</header>

<div id="diagnostic"></div>
<div id="toast"></div>

<div class="container">

  <div class="card">

    <label for="data">Data</label>
    <input type="date" id="data">

    <label>Sentit del viatge</label>

    <div class="sentit-viatge">
      <label id="labelAnada">
        <input type="radio" name="sentit" value="anada" checked onchange="actualitzarSentitUI()">
        Anada
      </label>

      <label id="labelTornada">
        <input type="radio" name="sentit" value="tornada" onchange="actualitzarSentitUI()">
        Tornada
      </label>
    </div>

    <label for="linia">Número de ruta</label>

    <!-- Es plena amb les rutes ja importades en este dispositiu -->
    <select id="linia" onchange="canviLinia()">
      <option value="">SELECCIONAR RUTA</option>
    </select>

    <label for="cerca">Cercar alumne</label>
    <input type="text" id="cerca" placeholder="Escriu un cognom o nom...">

    <label for="filtrePoblacio">Filtrar per població</label>
    <select id="filtrePoblacio" onchange="pintarLlista()">
      <option value="">Totes les poblacions</option>
    </select>

    <div class="fila-botons-inline">
      <button type="button" class="btn btn-secundari" onclick="marcarTots(true)">
        Marcar tots
      </button>

      <button type="button" class="btn btn-secundari" onclick="marcarTots(false)">
        Desmarcar tots
      </button>
    </div>

  </div>

  <div class="card">
    <div class="resum-top">
      <span>Usuaris pujats</span>
      <span class="comptador-total" id="comptadorTotal">0 / 0</span>
    </div>

    <div class="llista-usuaris" id="llistaUsuaris">
      <div class="missatge-buit">
        Puja un JSON per a carregar una ruta i els seus usuaris.
      </div>
    </div>
  </div>

  <div class="card">

    <button type="button" class="btn btn-enviar" onclick="enviarCorreu()">
      📧 Enviar per correu
    </button>

    <button type="button" class="btn btn-compartir" onclick="compartirFitxerJSON()">
      📎 Compartir o descarregar fitxer JSON
    </button>

    <button type="button" class="btn btn-importar" onclick="document.getElementById('inputFitxerJSON').click()">
      📥 Importar JSON d'usuaris
    </button>

    <input
      type="file"
      id="inputFitxerJSON"
      accept="application/json,.json"
      onchange="gestionarFitxerImportat(event)"
    >

    <button type="button" class="btn btn-reiniciar" onclick="reiniciarDia()">
      🗑️ Esborrar assistència d'este viatge
    </button>

  </div>

</div>

<div class="modal-overlay" id="modalImportacio">
  <div class="modal">
    <p id="textModalImportacio"></p>

    <div class="fila-botons">
      <button
        type="button"
        class="btn"
        style="background:var(--verd)"
        onclick="confirmarImportacio('fusionar')"
      >
        Fusionar
      </button>

      <button
        type="button"
        class="btn btn-reiniciar"
        onclick="confirmarImportacio('reemplacar')"
      >
        Reemplaçar
      </button>
    </div>

    <button
      type="button"
      class="btn"
      style="background:#999;margin-top:10px"
      onclick="cancelarImportacio()"
    >
      Cancel·lar
    </button>
  </div>
</div>

<div class="modal-overlay" id="modalAvis">
  <div class="modal" id="modalAvisContingut">
    <div class="modal-icona" id="modalAvisIcona">✅</div>
    <p id="textModalAvis"></p>

    <button
      type="button"
      class="btn"
      style="background:var(--verd)"
      onclick="tancarModalAvis()"
    >
      D'acord
    </button>
  </div>
</div>

<script>
/* ============================================================
 * CONFIGURACIÓ
 * ============================================================ */
var CORREU_DESTI='46021319.secretaria@edu.gva.es';

/* ============================================================
 * ESTAT
 * ============================================================ */
var usuaris=[];
var usuarisPendentsImport=[];
var rutaPendentImport='';
var memoriaAssistencia={};
var storageDisponible=true;
var temporitzadorToast=null;

var inputData=document.getElementById('data');
var dataAutomatica='';

/* ============================================================
 * UTILITATS
 * ============================================================ */
function mostrarAvis(m,t){
  document.getElementById('textModalAvis').textContent=m;

  var c=document.getElementById('modalAvisContingut');
  c.className='modal '+(t==='err'?'modal-err':'modal-ok');

  document.getElementById('modalAvisIcona').textContent=
    t==='err'?'⚠️':'✅';

  document.getElementById('modalAvis').classList.add('actiu');
}

function tancarModalAvis(){
  document.getElementById('modalAvis').classList.remove('actiu');
}

/* Missatge breu que no tapa l'avís permanent d'emmagatzematge */
function mostrarToast(text){
  var t=document.getElementById('toast');
  t.textContent=text;
  t.style.display='block';

  clearTimeout(temporitzadorToast);
  temporitzadorToast=setTimeout(function(){
    t.style.display='none';
  },1500);
}

function avisEmmagatzematge(){
  var dg=document.getElementById('diagnostic');
  dg.textContent='Avís: este mòbil no permet guardar dades. '+
    'Si tanques o recarregues la pàgina es perdrà la llista i l\'assistència.';
  dg.style.display='block';
}

function escaparHTML(texto){
  return String(texto)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

/* Minúscules i sense accents (per a cercar i comparar noms) */
function normalitzarText(s){
  s=String(s==null?'':s).toLowerCase();

  if(s.normalize){
    s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }

  return s;
}

function clauNom(s){
  return normalitzarText(s).replace(/\s+/g,' ').trim();
}

function poblacioDe(u){
  return String(u.poblacio||u.poblacion||'').trim()||'SENSE POBLACIÓ';
}

function rutaDeUsuari(u){
  return String(
    u.ruta_key ||
    u.ruta_id ||
    u.ruta ||
    ''
  ).split('|')[0].trim();
}

function mateixaRuta(a,b){
  return String(a).toUpperCase()===String(b).toUpperCase();
}

function usuarisDeRuta(ruta){
  if(!ruta){
    return [];
  }

  return usuaris.filter(function(u){
    return mateixaRuta(rutaDeUsuari(u),ruta);
  });
}

/* Data local (no UTC): evita que entre les 00:00 i les 02:00 isca el dia anterior */
function dataISO(d){
  function dd(n){
    return (n<10?'0':'')+n;
  }

  return d.getFullYear()+'-'+dd(d.getMonth()+1)+'-'+dd(d.getDate());
}

function dataValida(s){
  return /^\d{4}-\d{2}-\d{2}$/.test(s);
}

function nomSentit(s){
  return s==='tornada'?'Tornada':'Anada';
}

/* ============================================================
 * EMMAGATZEMATGE
 * ============================================================ */
function provarLocalStorage(){
  try{
    var k='__test_ls__';
    localStorage.setItem(k,'1');
    localStorage.removeItem(k);
    return true;
  }catch(e){
    return false;
  }
}

function guardarUsuarisLocalment(){
  if(!storageDisponible){
    return;
  }

  try{
    localStorage.setItem('usuarisAutobus',JSON.stringify(usuaris));
  }catch(e){
    avisEmmagatzematge();
  }
}

function carregarAssistenciaGuardada(){
  if(!storageDisponible){
    return memoriaAssistencia;
  }

  try{
    var t=JSON.parse(localStorage.getItem('assistenciaAutobus')||'{}');
    return (t&&typeof t==='object'&&!Array.isArray(t))?t:{};
  }catch(e){
    return {};
  }
}

function guardarAssistenciaGuardada(t){
  memoriaAssistencia=t;

  if(!storageDisponible){
    return;
  }

  try{
    localStorage.setItem('assistenciaAutobus',JSON.stringify(t));
  }catch(e){
    /* A partir d'ací es treballa en memòria perquè no es perda res */
    storageDisponible=false;
    avisEmmagatzematge();
  }
}

/* Garanteix que cada usuari té un id numèric únic */
function normalitzarIds(){
  var vistos={};
  var max=0;
  var canvi=false;

  usuaris=usuaris.filter(function(u){
    return u&&typeof u==='object';
  });

  usuaris.forEach(function(u){
    var n=Number(u.id);
    if(n>0&&isFinite(n)){
      max=Math.max(max,n);
    }
  });

  usuaris.forEach(function(u){
    var n=Number(u.id);

    if(!(n>0&&isFinite(n))||vistos[n]){
      u.id=++max;
      canvi=true;
    }else{
      u.id=n;
    }

    vistos[u.id]=true;
  });

  if(canvi){
    guardarUsuarisLocalment();
  }
}

/* ============================================================
 * RUTA, SENTIT I REGISTRE
 * ============================================================ */
function clauRegistre(data,sentit){
  return data+'_'+sentit+'_'+document.getElementById('linia').value;
}

function sentitSeleccionat(){
  var r=document.getElementsByName('sentit');

  for(var i=0;i<r.length;i++){
    if(r[i].checked){
      return r[i].value;
    }
  }

  return 'anada';
}

function actualitzarSentitUI(){
  var s=sentitSeleccionat();

  document.getElementById('labelAnada').className=
    s==='anada'?'actiu':'';

  document.getElementById('labelTornada').className=
    s==='tornada'?'actiu':'';

  pintarLlista();
}

function llistaRutes(){
  var rutes=[];

  usuaris.forEach(function(u){
    var r=rutaDeUsuari(u);

    if(r && !rutes.some(function(x){return mateixaRuta(x,r);})){
      rutes.push(r);
    }
  });

  rutes.sort(function(a,b){
    return a.localeCompare(b,'ca',{numeric:true});
  });

  return rutes;
}

function omplirSelectorRutes(seleccio){
  var sel=document.getElementById('linia');

  sel.innerHTML=
    '<option value="">SELECCIONAR RUTA</option>'+
    llistaRutes().map(function(r){
      return '<option value="'+escaparHTML(r)+'">'+escaparHTML(r)+'</option>';
    }).join('');

  sel.value='';

  if(seleccio){
    for(var i=0;i<sel.options.length;i++){
      if(sel.options[i].value && mateixaRuta(sel.options[i].value,seleccio)){
        sel.value=sel.options[i].value;
        break;
      }
    }
  }
}

function canviLinia(){
  omplirFiltrePoblacio();
  pintarLlista();
}

function omplirFiltrePoblacio(){
  var rutaSeleccionada=document.getElementById('linia').value;
  var selector=document.getElementById('filtrePoblacio');
  var anterior=selector.value;

  var poblacions=[];

  usuarisDeRuta(rutaSeleccionada).forEach(function(u){
    var p=poblacioDe(u);

    if(poblacions.indexOf(p)<0){
      poblacions.push(p);
    }
  });

  poblacions.sort(function(a,b){
    return a.localeCompare(b,'ca');
  });

  selector.innerHTML=
    '<option value="">Totes les poblacions</option>'+
    poblacions.map(function(p){
      return '<option value="'+escaparHTML(p)+'">'+escaparHTML(p)+'</option>';
    }).join('');

  selector.value=poblacions.indexOf(anterior)>=0?anterior:'';
}

function marcatsActuals(){
  var t=carregarAssistenciaGuardada();
  var r=t[clauRegistre(inputData.value,sentitSeleccionat())];

  return r&&Array.isArray(r.marcats)
    ?r.marcats.map(Number)
    :[];
}

/* ============================================================
 * LLISTA I COMPTADOR
 * ============================================================ */
function pintarLlista(){
  var c=document.getElementById('llistaUsuaris');
  var v=document.getElementById('linia').value;

  if(!v){
    c.innerHTML=
      '<div class="missatge-buit">'+
      (usuaris.length
        ?'Selecciona una ruta o importa un JSON.'
        :'Puja un JSON per a carregar una ruta i els seus usuaris.')+
      '</div>';

    actualitzarComptador();
    return;
  }

  var ruta=usuarisDeRuta(v);
  var q=normalitzarText(document.getElementById('cerca').value.trim());
  var pf=document.getElementById('filtrePoblacio').value;
  var m=marcatsActuals();

  var f=ruta.filter(function(u){
    return (!q || normalitzarText(u.nom).indexOf(q)>=0) &&
      (!pf || poblacioDe(u)===pf);
  });

  if(!f.length){
    c.innerHTML=
      '<div class="missatge-buit">'+
      'Cap alumne coincideix amb la cerca/filtre.'+
      '</div>';

    actualitzarComptador();
    return;
  }

  var agrupats={};

  f.forEach(function(u){
    var p=poblacioDe(u);

    if(!agrupats[p]){
      agrupats[p]=[];
    }

    agrupats[p].push(u);
  });

  var html='';

  Object.keys(agrupats)
    .sort(function(a,b){return a.localeCompare(b,'ca');})
    .forEach(function(p){
      html+='<div class="grup-poblacio">'+escaparHTML(p)+'</div>';

      agrupats[p]
        .sort(function(a,b){
          return String(a.nom||'').localeCompare(String(b.nom||''),'ca');
        })
        .forEach(function(u){
          var id=Number(u.id);

          html+=
            '<label class="fila-usuari">'+
              '<input type="checkbox" data-id="'+id+'" '+
                (m.indexOf(id)>=0?'checked':'')+
                ' onchange="canviAssistenciaAutomatica()">'+
              '<span class="info-usuari">'+
                '<span class="nom-usuari">'+escaparHTML(u.nom||'')+'</span>'+
                '<span class="detall-usuari">'+escaparHTML(u.curs||'')+'</span>'+
              '</span>'+
            '</label>';
        });
    });

  c.innerHTML=html;
  actualitzarComptador();
}

/*
 * El comptador es calcula a partir del registre guardat,
 * no de les caselles visibles: així és correcte encara que
 * hi haja una cerca o un filtre de població actius.
 */
function actualitzarComptador(){
  var v=document.getElementById('linia').value;
  var el=document.getElementById('comptadorTotal');

  if(!v){
    el.textContent='0 / 0';
    return;
  }

  var ruta=usuarisDeRuta(v);
  var m=marcatsActuals();

  var n=ruta.filter(function(u){
    return m.indexOf(Number(u.id))>=0;
  }).length;

  el.textContent=n+' / '+ruta.length;
}

/* ============================================================
 * GUARDAR ASSISTÈNCIA
 * ============================================================ */
function guardarAssistenciaDia(){
  var selectorRuta=document.getElementById('linia');
  var d=inputData.value;
  var s=sentitSeleccionat();

  if(!selectorRuta.value || !dataValida(d)){
    return false;
  }

  var t=carregarAssistenciaGuardada();
  var key=clauRegistre(d,s);

  var registre=t[key]||{
    data:d,
    sentit:s,
    linia:selectorRuta.value,
    marcats:[]
  };

  var visibles=[].slice.call(
    document.querySelectorAll('.fila-usuari input')
  ).map(function(x){
    return Number(x.dataset.id);
  });

  var marcats=[].slice.call(
    document.querySelectorAll('.fila-usuari input:checked')
  ).map(function(x){
    return Number(x.dataset.id);
  });

  var anteriors=Array.isArray(registre.marcats)
    ?registre.marcats.map(Number)
    :[];

  /* Es conserven els marcats que ara no es veuen per la cerca/filtre */
  var finals=anteriors.filter(function(id){
    return visibles.indexOf(id)<0;
  });

  marcats.forEach(function(id){
    if(finals.indexOf(id)<0){
      finals.push(id);
    }
  });

  registre.data=d;
  registre.sentit=s;
  registre.linia=selectorRuta.value;
  registre.marcats=finals;

  t[key]=registre;

  guardarAssistenciaGuardada(t);
  actualitzarComptador();

  return true;
}

function canviAssistenciaAutomatica(){
  if(!guardarAssistenciaDia()){
    mostrarToast('Indica una data vàlida per a guardar l\'assistència');
    return;
  }

  var d=construirJSON();
  mostrarToast('Guardat: '+d.total_usuaris+' usuaris pujats');
}

function marcarTots(valor){
  if(!document.getElementById('linia').value){
    mostrarAvis('No hi ha cap ruta seleccionada.','err');
    return;
  }

  var caselles=document.querySelectorAll('.fila-usuari input');

  if(!caselles.length){
    return;
  }

  if(
    !valor &&
    document.querySelectorAll('.fila-usuari input:checked').length &&
    !confirm('Segur que vols desmarcar tots els alumnes de la llista?')
  ){
    return;
  }

  [].forEach.call(caselles,function(x){
    x.checked=valor;
  });

  canviAssistenciaAutomatica();
}

/* ============================================================
 * JSON I ENVIAMENT
 * ============================================================ */

/*
 * construirJSON(): genera el JSON dels alumnes pujats, filtrat per
 * ruta, data i sentit (anada/tornada) seleccionats actualment, I TAMBÉ
 * per la població seleccionada en «Filtrar per població» quan n'hi ha
 * una activa (si el filtre és "Totes les poblacions", no es restringeix).
 */
function construirJSON(){
  var d=inputData.value;
  var s=sentitSeleccionat();
  var v=document.getElementById('linia').value;
  var pf=document.getElementById('filtrePoblacio').value;
  var ids=marcatsActuals();

  var arr=usuarisDeRuta(v).filter(function(u){
    return ids.indexOf(Number(u.id))>=0 &&
      (!pf || poblacioDe(u)===pf);
  });

  arr.sort(function(a,b){
    return poblacioDe(a).localeCompare(poblacioDe(b),'ca') ||
      String(a.nom||'').localeCompare(String(b.nom||''),'ca');
  });

  return{
    data:d,
    sentit:s,
    linia:v,
    poblacio:pf||'Totes',
    total_usuaris:arr.length,
    usuaris_pujats:arr.map(function(u){
      return{
        nom:u.nom||'',
        curs:u.curs||'',
        poblacio:poblacioDe(u)
      };
    })
  };
}

function textAssumpte(d){
  var base='Control autobús ruta '+d.linia+' - '+d.data+' ('+nomSentit(d.sentit)+')';

  return (d.poblacio && d.poblacio!=='Totes')
    ?base+' - '+d.poblacio
    :base;
}

function capcaleraCorreu(d){
  var linies=[
    'Control diari d\'usuaris de l\'autobús',
    'Data: '+d.data,
    'Sentit: '+nomSentit(d.sentit),
    'Número de ruta: '+d.linia
  ];

  if(d.poblacio && d.poblacio!=='Totes'){
    linies.push('Població: '+d.poblacio);
  }

  linies.push('Total usuaris: '+d.total_usuaris);

  return linies.join('\n');
}

function construirMailto(assumpte,cos){
  return 'mailto:'+CORREU_DESTI+
    '?subject='+encodeURIComponent(assumpte)+
    '&body='+encodeURIComponent(cos);
}

function obrirMailto(url){
  window.location.href=url;
}

/* Valida, guarda l'estat actual i torna les dades a enviar (o null) */
function prepararEnviament(){
  if(!document.getElementById('linia').value){
    mostrarAvis(
      'Primer has de seleccionar una ruta o importar un JSON amb la informació de la ruta.',
      'err'
    );
    return null;
  }

  if(!dataValida(inputData.value)){
    mostrarAvis('Indica una data vàlida.','err');
    return null;
  }

  guardarAssistenciaDia();

  var d=construirJSON();

  if(!d.total_usuaris){
    mostrarAvis(
      d.poblacio && d.poblacio!=='Totes'
        ?'No hi ha cap usuari marcat per a la població «'+d.poblacio+'».'
        :'No hi ha cap usuari marcat per enviar.',
      'err'
    );
    return null;
  }

  return d;
}

/*
 * enviarCorreu(): insereix directament el JSON complet (indentat,
 * filtrat per ruta+sentit+data+població) dins del cos del correu.
 * NO es comprova la longitud de l'enllaç mailto: s'envia sempre
 * directament, siga quina siga la mida de la llista.
 */
function enviarCorreu(){
  var d=prepararEnviament();

  if(!d){
    return;
  }

  var cos=capcaleraCorreu(d)+
    '\n\n--- JSON ---\n'+
    JSON.stringify(d,null,2);

  obrirMailto(construirMailto(textAssumpte(d),cos));
}

function copiarText(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(
      function(){return true;},
      function(){return copiarTextAntic(text);}
    );
  }

  return Promise.resolve(copiarTextAntic(text));
}

function copiarTextAntic(text){
  var ta=document.createElement('textarea');

  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.position='fixed';
  ta.style.top='-1000px';
  ta.style.opacity='0';

  document.body.appendChild(ta);
  ta.select();

  try{
    ta.setSelectionRange(0,text.length);
  }catch(e){}

  var ok=false;

  try{
    ok=document.execCommand('copy');
  }catch(e){}

  document.body.removeChild(ta);

  return ok;
}

function nomFitxerSegur(s){
  return String(s).replace(/[^\w-]+/g,'_');
}

function descarregarFitxer(nom,contingut){
  var blob=new Blob([contingut],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');

  a.href=url;
  a.download=nom;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(function(){
    URL.revokeObjectURL(url);
  },4000);
}

/*
 * Envia el JSON com a fitxer adjunt: amb el menú de compartir del mòbil
 * quan el navegador ho permet, i si no, el descarrega.
 * El fitxer respecta el mateix filtre de població que s'estiga
 * aplicant en eixe moment (o tots si no n'hi ha cap seleccionat).
 */
function compartirFitxerJSON(){
  var d=prepararEnviament();

  if(!d){
    return;
  }

  var sufixPoblacio=(d.poblacio && d.poblacio!=='Totes')
    ?'_'+nomFitxerSegur(d.poblacio)
    :'';

  var nom='control_autobus_ruta'+nomFitxerSegur(d.linia)+
    '_'+d.data+'_'+d.sentit+sufixPoblacio+'.json';

  var contingut=JSON.stringify(d,null,2);
  var fitxer=null;

  try{
    fitxer=new File([contingut],nom,{type:'application/json'});
  }catch(e){}

  if(
    fitxer &&
    navigator.canShare &&
    navigator.share &&
    navigator.canShare({files:[fitxer]})
  ){
    navigator.share({
      files:[fitxer],
      title:textAssumpte(d),
      text:textAssumpte(d)
    }).catch(function(err){
      if(!err || err.name!=='AbortError'){
        descarregarFitxer(nom,contingut);
      }
    });
    return;
  }

  descarregarFitxer(nom,contingut);

  mostrarAvis(
    'S\'ha descarregat el fitxer '+nom+
    '. Adjunta\'l a un correu per a '+CORREU_DESTI+'.',
    'ok'
  );
}

/* ============================================================
 * IMPORTACIÓ
 * ============================================================ */
function extraureNumeroRuta(d,llista){
  var numero='';

  if(d.numero_ruta){
    numero=String(d.numero_ruta);
  }

  if(!numero && d.ruta_id){
    numero=String(d.ruta_id);
  }

  if(!numero && d.ruta){
    if(typeof d.ruta==='object'){
      numero=String(d.ruta.id||d.ruta.numero||d.ruta.numero_ruta||'');
    }else{
      numero=String(d.ruta);
    }
  }

  if(!numero && d.rutes){
    if(typeof d.rutes==='object'){
      numero=String(d.rutes.id||d.rutes.numero||d.rutes.numero_ruta||'');
    }else{
      numero=String(d.rutes);
    }
  }

  /* Si el JSON és només una llista, es mira la ruta dels usuaris */
  if(!numero && Array.isArray(llista)){
    for(var i=0;i<llista.length;i++){
      if(llista[i] && typeof llista[i]==='object'){
        numero=rutaDeUsuari(llista[i]);
        if(numero){
          break;
        }
      }
    }
  }

  return numero.split('|')[0].trim();
}

function extraureLlistaUsuaris(d){
  if(Array.isArray(d)){
    return d;
  }

  if(Array.isArray(d.usuaris)){
    return d.usuaris;
  }

  if(Array.isArray(d.usuarios)){
    return d.usuarios;
  }

  if(Array.isArray(d.users)){
    return d.users;
  }

  return null;
}

function gestionarFitxerImportat(e){
  var f=e.target.files[0];

  if(!f){
    return;
  }

  var lector=new FileReader();

  lector.onload=function(x){
    e.target.value='';

    var d;

    try{
      d=JSON.parse(x.target.result);
    }catch(err){
      mostrarAvis('El fitxer no és un JSON vàlid.','err');
      return;
    }

    if(!d || typeof d!=='object'){
      mostrarAvis('El JSON no té el format esperat.','err');
      return;
    }

    var llista=extraureLlistaUsuaris(d);

    if(!llista){
      mostrarAvis('El JSON no té el format esperat.','err');
      return;
    }

    var numeroRuta=extraureNumeroRuta(d,llista);

    if(!numeroRuta){
      mostrarAvis('El fitxer JSON no té el número de ruta.','err');
      return;
    }

    usuarisPendentsImport=llista.filter(function(u){
      return u && typeof u==='object' && String(u.nom||u.nombre||'').trim();
    }).map(function(u){
      return{
        nom:String(u.nom||u.nombre).trim(),
        curs:String(u.curs||u.curso||'').trim(),
        poblacio:String(u.poblacio||u.poblacion||'').trim()
      };
    });

    if(!usuarisPendentsImport.length){
      mostrarAvis('No s\'ha trobat cap usuari vàlid.','err');
      return;
    }

    /* La ruta no es canvia fins que es confirma la importació */
    rutaPendentImport=numeroRuta;

    var rutaActual=document.getElementById('linia').value;
    var existents=usuarisDeRuta(numeroRuta).length;

    document.getElementById('textModalImportacio').innerHTML=
      'Ruta: <b>'+escaparHTML(numeroRuta)+'</b><br>'+
      'S\'han trobat <b>'+usuarisPendentsImport.length+'</b> usuaris al fitxer.'+
      (existents
        ?'<br>Esta ruta ja té <b>'+existents+'</b> usuaris guardats.'
        :'')+
      (rutaActual && !mateixaRuta(rutaActual,numeroRuta)
        ?'<br><br>Atenció: ara tens seleccionada la ruta <b>'+
          escaparHTML(rutaActual)+'</b>. Es canviarà a la ruta del fitxer.'
        :'')+
      '<br><br>Com vols importar-los?';

    document.getElementById('modalImportacio').classList.add('actiu');
  };

  lector.onerror=function(){
    e.target.value='';
    mostrarAvis('No s\'ha pogut llegir el fitxer.','err');
  };

  lector.readAsText(f);
}

function confirmarImportacio(mode){
  var ruta=rutaPendentImport;

  if(!ruta || !usuarisPendentsImport.length){
    cancelarImportacio();
    return;
  }

  if(
    mode==='reemplacar' &&
    !confirm('Això substituirà els usuaris d\'esta ruta. Continuar?')
  ){
    return;
  }

  /* Usuaris existents de la ruta, per nom (sense accents ni majúscules) */
  var perNom={};

  usuarisDeRuta(ruta).forEach(function(u){
    var k=clauNom(u.nom);
    if(!(k in perNom)){
      perNom[k]=u;
    }
  });

  var max=usuaris.reduce(function(n,u){
    return Math.max(n,Number(u.id)||0);
  },0);

  var missatge;

  if(mode==='reemplacar'){
    /*
     * Es reaprofita l'id dels alumnes que ja existien:
     * així l'assistència ja marcada hui no es perd.
     */
    var usats={};

    var nous=usuarisPendentsImport.map(function(p){
      var ant=perNom[clauNom(p.nom)];
      var id=(ant && !usats[ant.id])?Number(ant.id):++max;

      usats[id]=true;

      return{
        id:id,
        nom:p.nom,
        curs:p.curs,
        poblacio:p.poblacio||'SENSE POBLACIÓ',
        ruta_key:ruta
      };
    });

    usuaris=usuaris.filter(function(u){
      return !mateixaRuta(rutaDeUsuari(u),ruta);
    }).concat(nous);

    missatge='Ruta '+ruta+': llistat reemplaçat ('+nous.length+' usuaris).';
  }else{
    var afegits=0;
    var actualitzats=0;

    usuarisPendentsImport.forEach(function(p){
      var k=clauNom(p.nom);
      var ant=perNom[k];

      if(ant){
        if(p.curs){ ant.curs=p.curs; }
        if(p.poblacio){ ant.poblacio=p.poblacio; }
        actualitzats++;
      }else{
        var nou={
          id:++max,
          nom:p.nom,
          curs:p.curs,
          poblacio:p.poblacio||'SENSE POBLACIÓ',
          ruta_key:ruta
        };

        usuaris.push(nou);
        perNom[k]=nou;
        afegits++;
      }
    });

    missatge='Ruta '+ruta+': '+afegits+' usuaris nous, '+
      actualitzats+' ja existien.';
  }

  guardarUsuarisLocalment();

  omplirSelectorRutes(ruta);
  document.getElementById('filtrePoblacio').value='';
  omplirFiltrePoblacio();
  pintarLlista();

  cancelarImportacio();

  mostrarAvis(missatge,'ok');
}

function cancelarImportacio(){
  document.getElementById('modalImportacio').classList.remove('actiu');
  usuarisPendentsImport=[];
  rutaPendentImport='';
}

/* ============================================================
 * ESBORRAR
 * ============================================================ */
function reiniciarDia(){
  if(!document.getElementById('linia').value){
    mostrarAvis('No hi ha cap ruta seleccionada.','err');
    return;
  }

  if(!confirm('Segur que vols esborrar l\'assistència d\'este viatge?')){
    return;
  }

  var t=carregarAssistenciaGuardada();

  delete t[clauRegistre(inputData.value,sentitSeleccionat())];

  guardarAssistenciaGuardada(t);
  pintarLlista();

  mostrarAvis('Assistència esborrada.','ok');
}

/* ============================================================
 * DATA AUTOMÀTICA
 * Si la pàgina es queda oberta d'un dia per a l'altre, la data
 * s'actualitza sola (llevat que l'haja canviada l'usuari), per a
 * no guardar ni enviar l'assistència amb la data d'ahir.
 * ============================================================ */
function comprovarCanviDia(){
  var hui=dataISO(new Date());

  if(hui!==dataAutomatica && inputData.value===dataAutomatica){
    inputData.value=hui;
    dataAutomatica=hui;
    pintarLlista();
    mostrarToast('Data actualitzada a hui ('+hui+')');
  }
}
